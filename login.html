<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      rel="icon"
      href="https://images-platform.99static.com/OIfmvv6sAJgaQtlXsS5u-qsRxSA=/180x0:780x600/fit-in/99designs-contests-attachments/54/54823/attachment_54823493"
    />
    <title>EasyNights</title>
  </head>
  <body>
    <main>
      <nav class="navbar">
        <a href="./index.html"><h1>EasyNights</h1></a>
        <ul>
          <a href="./index.html"><li>Home</li></a>
          <a href="./Rooms.html"><li>Rooms</li></a>
          <a href="./hotels.html"><li>Hotels</li></a>
          <a href="./bookedRooms.html"><li>Booked Rooms</li></a>
          <a href="./login.html"><li>Log in</li></a>
        </ul>
        <i class="fa-solid fa-bars fa-xl"></i>
      </nav>
      <form action="">
        <label for="name">UserName</label>
        <input type="text" name="name" id="name" required class="form-input" />

        <label for="Email">Email</label>
        <input
          type="email"
          name="Email"
          id="Email"
          required
          class="form-input"
        />

        <label for="password">Password</label>
        <input
          type="password"
          name="password"
          id="password"
          required
          class="form-input"
        />

        <input type="submit" value="Log in" id="submit-button" />
      </form>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
      document.querySelector(".fa-bars").addEventListener("click", function () {
        const menu = document.querySelector("ul");
        menu.style.display = menu.style.display === "none" ? "flex" : "none";
      });
    </script>
  </body>
</html>
